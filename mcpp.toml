[package]
name = "systop"
version = "0.1.1"
description = "Terminal resource monitor for Windows"
license = "MIT"
platforms = ["windows"]

[build]
defines = ["NOMINMAX", "WIN32_LEAN_AND_MEAN"]

[runtime]
libraries = ["advapi32", "pdh", "iphlpapi", "ntdll"]

[dependencies]
cmdline = "0.0.2"

[dependencies.compat]
ftxui = "7.0.3"

[dev-dependencies]
mtest = "0.5.1"
